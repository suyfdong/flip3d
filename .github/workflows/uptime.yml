# Uptime for the pages third parties depend on (embed iframes).
# A failed scheduled run emails the committer. GitHub pauses schedules after
# 60 days without repo activity.
#
# Two layers:
#   origin — flip3d.pages.dev via curl. Not behind the zone's Bot Fight Mode,
#            so a plain HTTP check is reliable. Catches broken deploys.
#   edge   — flip3d.app in real headless Chromium. Proves the JS bundle,
#            three.js and the CORS sample fetch work end to end.
#            GitHub's runners are Azure IPs and headless Chromium's UA trips the
#            zone's "Challenge suspicious user agents" custom rule (managed
#            challenge, 403). The edge job therefore sends a secret header
#            (x-flip3d-uptime: ${{ secrets.UPTIME_TOKEN }}) that a Cloudflare
#            Skip rule, placed first, lets through. Without the Skip rule this
#            job is expected to fail. Manual + warning-only until verified.
name: Uptime

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

env:
  SAMPLE_GLB: https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Box/glTF-Binary/Box.glb

jobs:
  origin:
    name: Origin (flip3d.pages.dev)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pages respond with 200 and expected content
        run: |
          set -uo pipefail
          base="https://flip3d.pages.dev"
          check() {
            local url="$1" marker="$2" out code body
            out=$(curl -sS --max-time 20 -w $'\n%{http_code}' "$url") || { echo "::error::$url -> curl failed"; return 1; }
            code=${out##*$'\n'}; body=${out%$'\n'*}
            [ "$code" = "200" ] || { echo "::error::$url -> HTTP $code"; return 1; }
            grep -q -- "$marker" <<<"$body" || { echo "::error::$url -> 200 but '$marker' missing"; return 1; }
            echo "ok  $url"
          }
          fail=0
          check "$base/" "Flip3D" || fail=1
          check "$base/embed/stl-viewer/?url=$SAMPLE_GLB" "Embedded 3D Viewer" || fail=1
          check "$base/stl-viewer/" "Online STL Viewer" || fail=1
          chunk=$(curl -sS --max-time 20 "$base/embed/stl-viewer/" | grep -o '/_next/static/[^"]*\.js' | head -1 || true)
          if [ -n "$chunk" ]; then
            code=$(curl -s -o /dev/null --max-time 20 -w '%{http_code}' "$base$chunk")
            [ "$code" = "200" ] && echo "ok  chunk $chunk" || { echo "::error::chunk $chunk -> HTTP $code"; fail=1; }
          else
            echo "::error::embed page references no /_next/static JS chunk"; fail=1
          fi
          exit $fail

      - name: Partner CORS still allows flip3d.app (warning only)
        continue-on-error: true
        run: |
          h=$(curl -sI --max-time 20 -H "Origin: https://flip3d.app" "https://wiki.mayako.com/3d-print-files/5deg-wing-spacer.stl" | tr -d '\r' | grep -i '^access-control-allow-origin' || true)
          if [ -n "$h" ]; then echo "ok  wiki.mayako.com -> $h"; else
            echo "::warning::wiki.mayako.com no longer sends Access-Control-Allow-Origin for flip3d.app; their embedded viewers will show a CORS error."; exit 1; fi

  edge:
    name: Edge (flip3d.app in Chromium, manual, warning only)
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null
          npm i --no-save playwright@1.64.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Pages render in a real browser
        env:
          UPTIME_TOKEN: ${{ secrets.UPTIME_TOKEN }}
        run: |
          if [ -z "$UPTIME_TOKEN" ]; then echo "::error::UPTIME_TOKEN secret not set"; exit 1; fi
          cat > check.mjs <<'JS'
          import { chromium } from "playwright";
          const SAMPLE = process.env.SAMPLE_GLB;
          // No GPU on the runner: force software WebGL so three.js can render.
          const browser = await chromium.launch({
            args: ["--use-angle=swiftshader", "--use-gl=angle", "--enable-unsafe-swiftshader", "--ignore-gpu-blocklist"],
          });
          const ctx = await browser.newContext({
            extraHTTPHeaders: { "x-flip3d-uptime": process.env.UPTIME_TOKEN },
          });
          const page = await ctx.newPage();
          const errors = [];
          page.on("console", (m) => { if (m.type() === "error") errors.push(m.text().slice(0, 160)); });
          page.on("pageerror", (e) => errors.push(String(e).slice(0, 160)));
          let fail = 0;
          async function check(label, url, assert) {
            try {
              const resp = await page.goto(url, { waitUntil: "load", timeout: 45000 });
              const status = resp?.status();
              if ((await page.title()).includes("Just a moment")) {
                await page.waitForFunction(() => !document.title.includes("Just a moment"), null, { timeout: 20000 }).catch(() => {});
              }
              if ((await page.title()).includes("Just a moment")) {
                throw new Error(`Cloudflare challenge not solved in headless Chromium (HTTP ${status}). Check Bot Fight Mode / WAF.`);
              }
              await assert(status);
              console.log("ok ", label);
            } catch (e) {
              fail = 1;
              console.log(`::error::${label} -> ${e.message.split("\n")[0]}`);
              const txt = await page.evaluate(() => document.body.innerText.replace(/\s+/g, " ").slice(0, 300)).catch(() => "");
              console.log(`   page text: ${txt}`);
              console.log(`   console errors: ${errors.slice(0, 5).join(" | ")}`);
            }
          }
          await check("home", "https://flip3d.app/", async (s) => {
            if (s !== 200) throw new Error(`HTTP ${s}`);
            if (!(await page.title()).includes("Flip3D")) throw new Error("title mismatch");
          });
          await check("embed renders model + Open-in-Flip3D badge",
            `https://flip3d.app/embed/stl-viewer/?url=${encodeURIComponent(SAMPLE)}`, async (s) => {
            if (s !== 200) throw new Error(`HTTP ${s}`);
            await page.waitForSelector("canvas", { timeout: 30000 });
            await page.waitForFunction(() => /Open in/.test(document.body.innerText), null, { timeout: 20000 });
          });
          await check("stl-viewer", "https://flip3d.app/stl-viewer/", async (s) => {
            if (s !== 200) throw new Error(`HTTP ${s}`);
            if (!(await page.title()).includes("STL Viewer")) throw new Error("title mismatch");
          });
          await browser.close();
          process.exit(fail);
          JS
          node check.mjs
